services:
  - type: web
    name: malika-herbalife
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    disk:
      name: malika-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/malika.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PERSIST_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: malika
      - key: ADMIN_PASSWORD
        sync: false
